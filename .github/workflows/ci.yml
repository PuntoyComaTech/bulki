name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

  node20:
    # The published CLI supports Node >= 20.9 but the dev toolchain needs Node 22:
    # build on 24, then run the built binary on 20.
    name: Smoke test on Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run the built CLI on Node 20
        run: |
          node --version
          node dist/bin/bulki.js --version
          node dist/bin/bulki.js compress tests/fixtures -o "/tmp/out dir" -f webp
          ls "/tmp/out dir"
          node dist/bin/bulki.js pipe -f webp < tests/fixtures/sample.jpg > /tmp/p.webp
          test -s /tmp/p.webp
